model_type = 'tiny-llm'
n_layer = 12
n_head = 12
n_embd =  768

# these options must be filled in externally
vocab_size = 49_152
context_size = 2048

# dropout hyperparameters
embd_pdrop = 0.1
resid_pdrop = 0.1
attn_pdrop = 0.1

[models]
tiny-llm-nano = {n_layer=3, n_head=3, n_embd=48}  # 2.5M params
tiny-llm-micro = {n_layer=4, n_head=4, n_embd=128}  # 7M params
tiny-llm-mini = {n_layer=6, n_head=6, n_embd=192}  # 12M params
tiny-llm = {n_layer=12, n_head=12, n_embd=768}  # 124M params
tiny-llm-medium = {n_layer=24, n_head=16, n_embd=1024} # 350M params
tiny-llm-large = {n_layer=36, n_head=20, n_embd=1280} # 774M params
tiny-llm-xl = {n_layer=48, n_head=25, n_embd=1600} # 1558M params

[trainer]
device = "auto"          # "auto", "cuda", or "cpu"
batch_size = 8
accumulation_steps = 64  # 512 / batch_size
num_workers = 0
learning_rate = 5e-4
weight_decay = 0.1
betas = [0.9, 0.95]
grad_norm_clip = 1.0
max_iters = 50_000

[sft]
learning_rate = 2e-5
warmup_steps = 200
epochs = 2

[system]
checkpoints = "checkpoints/"
work_dir = "./out"
data_dir = "/media/datasets/fineweb_10BT"